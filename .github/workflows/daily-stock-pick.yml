name: Daily A-share Stock Picks

on:
  workflow_dispatch:
  schedule:
    - cron: "20 10 * * 1-5"

permissions:
  contents: read

jobs:
  screen-and-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      TZ: Asia/Shanghai
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
      FEISHU_WEBHOOK_SECRET: ${{ secrets.FEISHU_WEBHOOK_SECRET }}
      DAILY_SOURCE: auto
      DAILY_ENRICH_ENABLED: "true"
      DAILY_ENRICH_MAX_CANDIDATES: "40"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install AlphaSift
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: AlphaSift preliminary screening
        run: |
          alphasift screen momentum_quality \
            --no-llm \
            --max-output 20 \
            --save-run \
            > alphasift-output.json

          python -m json.tool alphasift-output.json > /dev/null

      - name: DeepSeek ranking and Feishu notification
        run: |
          python - <<'PY'
          import os
          import json
          import time
          import hmac
          import base64
          import hashlib
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          import requests

          api_key = os.environ["DEEPSEEK_API_KEY"].strip()
          webhook = os.environ["FEISHU_WEBHOOK_URL"].strip()
          webhook_secret = os.environ.get(
              "FEISHU_WEBHOOK_SECRET",
              ""
          ).strip()

          source = json.loads(
              Path("alphasift-output.json").read_text(
                  encoding="utf-8"
              )
          )

          raw_picks = source.get("picks", [])[:20]

          if len(raw_picks) < 5:
              raise RuntimeError(
                  f"AlphaSift候选不足5只，当前只有{len(raw_picks)}只"
              )

          def normalize_code(value):
              code = str(value or "").strip()

              if code.endswith(".0"):
                  code = code[:-2]

              if code.isdigit():
                  code = code.zfill(6)

              return code

          candidates = []

          for pick in raw_picks:
              candidates.append({
                  "code": normalize_code(pick.get("code")),
                  "name": pick.get("name"),
                  "rule_score": pick.get(
                      "screen_score",
                      pick.get("final_score")
                  ),
                  "price": pick.get("price"),
                  "change_pct": pick.get("change_pct"),
                  "turnover_rate": pick.get("turnover_rate"),
                  "pe_ratio": pick.get("pe_ratio"),
                  "pb_ratio": pick.get("pb_ratio"),
                  "industry": pick.get("industry"),
                  "risk_summary": pick.get("risk_summary"),
                  "signal_score": pick.get("signal_score"),
                  "volume_ratio": pick.get(
                      "volume_ratio_20d",
                      pick.get("volume_ratio")
                  ),
                  "rsi_status": pick.get("rsi_status"),
                  "macd_status": pick.get("macd_status")
              })

          system_prompt = """
          你是A股量化研究筛选助手。

          请从给出的候选股票中进行二次排序，同时考虑：
          1. 市场情绪和资金活跃度；
          2. 趋势、成交量和换手率；
          3. 基本面质量及估值合理性；
          4. 追高风险、流动性风险和回撤风险；
          5. 行业分散。

          必须遵守以下规则：
          - 返回10只排序候选，供程序最终选择5只；
          - 同一行业尽量只保留1只；
          - 银行股最多1只；
          - 不得添加候选名单之外的股票；
          - 股票代码必须保持6位字符串；
          - 必须只返回JSON对象；
          - 不要输出解释文字；
          - 不要使用Markdown代码框。

          返回JSON格式：
          {
            "market_view": "今日市场环境概述",
            "selection_logic": "本次选股逻辑",
            "recommendations": [
              {
                "code": "000001",
                "sector": "所属行业",
                "ai_score": 85,
                "reason": "入选理由",
                "catalyst": "可能的催化因素",
                "risk": "主要风险",
                "invalidator": "判断失效条件"
              }
            ]
          }
          """

          user_prompt = (
              "以下是AlphaSift从A股全市场初筛出的候选。"
              "请严格按照规定JSON格式重新排序：\n"
              + json.dumps(
                  candidates,
                  ensure_ascii=False,
                  separators=(",", ":")
              )
          )

          api_payload = {
              "model": "deepseek-v4-flash",
              "messages": [
                  {
                      "role": "system",
                      "content": system_prompt
                  },
                  {
                      "role": "user",
                      "content": user_prompt
                  }
              ],
              "response_format": {
                  "type": "json_object"
              },
              "thinking": {
                  "type": "disabled"
              },
              "max_tokens": 3000,
              "stream": False
          }

          api_response = requests.post(
              "https://api.deepseek.com/chat/completions",
              headers={
                  "Authorization": f"Bearer {api_key}",
                  "Content-Type": "application/json"
              },
              json=api_payload,
              timeout=180
          )

          if not api_response.ok:
              raise RuntimeError(
                  "DeepSeek API调用失败："
                  f"HTTP {api_response.status_code}，"
                  f"{api_response.text[:500]}"
              )

          api_data = api_response.json()

          try:
              content = (
                  api_data["choices"][0]["message"]["content"]
              ).strip()
          except (KeyError, IndexError, TypeError, AttributeError):
              raise RuntimeError(
                  "DeepSeek响应中没有有效正文"
              )

          if content.startswith("```"):
              content = content.replace("```json", "")
              content = content.replace("```", "")
              content = content.strip()

          start = content.find("{")
          end = content.rfind("}")

          if start < 0 or end < start:
              raise RuntimeError(
                  "DeepSeek没有返回JSON对象："
                  + content[:300]
              )

          try:
              decision = json.loads(
                  content[start:end + 1]
              )
          except json.JSONDecodeError as error:
              raise RuntimeError(
                  f"DeepSeek JSON解析失败：{error}"
              )

          recommendations = decision.get(
              "recommendations",
              []
          )

          if not isinstance(recommendations, list):
              raise RuntimeError(
                  "DeepSeek返回的recommendations不是列表"
              )

          candidate_map = {
              item["code"]: item
              for item in candidates
          }

          selected = []
          used_codes = set()
          used_sectors = set()
          bank_count = 0

          for item in recommendations:
              if not isinstance(item, dict):
                  continue

              code = normalize_code(item.get("code"))

              if code not in candidate_map:
                  continue

              if code in used_codes:
                  continue

              base = candidate_map[code]
              name = str(base.get("name") or "")
              is_bank = "银行" in name

              if is_bank and bank_count >= 1:
                  continue

              sector = str(
                  item.get("sector")
                  or base.get("industry")
                  or ""
              ).strip()

              sector_key = (
                  sector.lower()
                  if sector
                  else f"unknown-{code}"
              )

              if sector_key in used_sectors:
                  continue

              merged = dict(base)

              merged.update({
                  "sector": sector or "暂无行业信息",
                  "ai_score": item.get("ai_score"),
                  "reason": item.get("reason"),
                  "catalyst": item.get("catalyst"),
                  "risk": item.get("risk"),
                  "invalidator": item.get("invalidator")
              })

              selected.append(merged)
              used_codes.add(code)
              used_sectors.add(sector_key)

              if is_bank:
                  bank_count += 1

              if len(selected) == 5:
                  break

          if len(selected) < 5:
              raise RuntimeError(
                  "DeepSeek返回的有效跨行业候选不足5只，"
                  f"当前只有{len(selected)}只，已停止推送"
              )

          def number(value, digits=2):
              if value is None or value == "":
                  return "暂无"

              try:
                  return f"{float(value):.{digits}f}"
              except (TypeError, ValueError):
                  return str(value)

          def percent(value):
              if value is None or value == "":
                  return "暂无"

              try:
                  return f"{float(value):+.2f}%"
              except (TypeError, ValueError):
                  return str(value)

          date_text = datetime.now(
              ZoneInfo("Asia/Shanghai")
          ).strftime("%Y-%m-%d %H:%M")

          lines = [
              f"**时间：** {date_text}",
              "**流程：** AlphaSift初筛 → DeepSeek重排",
              "**策略：** 趋势＋资金情绪＋基本面＋行业分散",
              (
                  f"**筛选过程：** 全市场"
                  f"{source.get('snapshot_count', '暂无')}只"
                  f" → 初筛{len(raw_picks)}只 → Top 5"
              ),
              "",
              (
                  "**市场观点：** "
                  + str(
                      decision.get("market_view")
                      or "暂无"
                  )
              ),
              (
                  "**选股逻辑：** "
                  + str(
                      decision.get("selection_logic")
                      or "暂无"
                  )
              ),
              ""
          ]

          for index, pick in enumerate(selected, start=1):
              lines.extend([
                  (
                      f"---\n**{index}. "
                      f"{pick.get('name')}（{pick.get('code')}）**"
                  ),
                  (
                      f"AI评分：**"
                      f"{number(pick.get('ai_score'), 1)}**"
                  ),
                  (
                      f"规则评分："
                      f"{number(pick.get('rule_score'), 1)}"
                  ),
                  (
                      f"现价："
                      f"{number(pick.get('price'), 2)}"
                  ),
                  (
                      f"当日涨跌："
                      f"{percent(pick.get('change_pct'))}"
                  ),
                  (
                      f"换手率："
                      f"{percent(pick.get('turnover_rate'))}"
                  ),
                  f"行业：{pick.get('sector')}",
                  (
                      f"入选理由："
                      f"{pick.get('reason') or '暂无'}"
                  ),
                  (
                      f"催化因素："
                      f"{pick.get('catalyst') or '暂无'}"
                  ),
                  (
                      f"风险提示："
                      f"{pick.get('risk') or '暂无'}"
                  ),
                  (
                      f"失效条件："
                      f"{pick.get('invalidator') or '暂无'}"
                  )
              ])

          lines.extend([
              "---",
              "⚠️ 仅为量化研究候选，不构成投资建议。"
          ])

          card = {
              "config": {
                  "wide_screen_mode": True
              },
              "header": {
                  "template": "green",
                  "title": {
                      "tag": "plain_text",
                      "content": "📈 每日A股跨行业候选"
                  }
              },
              "elements": [
                  {
                      "tag": "div",
                      "text": {
                          "tag": "lark_md",
                          "content": "\n".join(lines)
                      }
                  }
              ]
          }

          feishu_payload = {
              "msg_type": "interactive",
              "card": card
          }

          if webhook_secret:
              timestamp = str(int(time.time()))
              string_to_sign = (
                  f"{timestamp}\n{webhook_secret}"
              )

              signature = base64.b64encode(
                  hmac.new(
                      string_to_sign.encode("utf-8"),
                      digestmod=hashlib.sha256
                  ).digest()
              ).decode("utf-8")

              feishu_payload["timestamp"] = timestamp
              feishu_payload["sign"] = signature

          feishu_response = requests.post(
              webhook,
              json=feishu_payload,
              timeout=30
          )

          feishu_response.raise_for_status()
          feishu_result = feishu_response.json()

          feishu_code = feishu_result.get(
              "code",
              feishu_result.get("StatusCode", 0)
          )

          if feishu_code != 0:
              raise RuntimeError(
                  f"飞书推送失败：{feishu_result}"
              )

          print("跨行业Top 5已成功发送到飞书")
          PY
