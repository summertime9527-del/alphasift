name: Daily A-share Stock Picks

on:
  workflow_dispatch:
  schedule:
    - cron: "20 10 * * 1-5"

permissions:
  contents: read

jobs:
  screen-and-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      TZ: Asia/Shanghai
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      LITELLM_MODEL: deepseek/deepseek-chat
      FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
      FEISHU_WEBHOOK_SECRET: ${{ secrets.FEISHU_WEBHOOK_SECRET }}
      DAILY_SOURCE: auto

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install AlphaSift
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Screen the A-share market
        run: |
          alphasift screen balanced_alpha --save-run > alphasift-output.json
          python -m json.tool alphasift-output.json > /dev/null

      - name: Format and send to Feishu
        run: |
          python - <<'PY'
          import os
          import json
          import time
          import hmac
          import base64
          import hashlib
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          import requests

          webhook = os.environ["FEISHU_WEBHOOK_URL"].strip()
          secret = os.environ.get("FEISHU_WEBHOOK_SECRET", "").strip()

          data = json.loads(
              Path("alphasift-output.json").read_text(encoding="utf-8")
          )

          picks = data.get("picks", [])[:5]

          if not picks:
              raise RuntimeError("AlphaSift 没有返回候选股票")

          def number(value, digits=2):
              if value is None or value == "":
                  return "暂无"
              try:
                  return f"{float(value):.{digits}f}"
              except (TypeError, ValueError):
                  return str(value)

          def percent(value):
              if value is None or value == "":
                  return "暂无"
              try:
                  return f"{float(value):+.2f}%"
              except (TypeError, ValueError):
                  return str(value)

          date_text = datetime.now(
              ZoneInfo("Asia/Shanghai")
          ).strftime("%Y-%m-%d %H:%M")

          snapshot_count = data.get("snapshot_count", "暂无")
          filtered_count = data.get("after_filter_count", "暂无")
          llm_ranked = data.get("llm_ranked", False)
          llm_status = "DeepSeek 已参与排序" if llm_ranked else "规则因子排序"

          lines = [
              f"**时间：** {date_text}",
              "**策略：** balanced_alpha（综合多因子）",
              f"**筛选过程：** {snapshot_count}只 → {filtered_count}只 → Top {len(picks)}",
              f"**排序方式：** {llm_status}",
              ""
          ]

          for index, pick in enumerate(picks, start=1):
              rank = pick.get("rank") or index
              name = pick.get("name") or "未知股票"
              code = pick.get("code") or "未知代码"
              score = number(pick.get("final_score"), 1)
              price = number(pick.get("price"), 2)
              change = percent(pick.get("change_pct"))

              sector = (
                  pick.get("llm_sector")
                  or pick.get("industry")
                  or "暂无行业信息"
              )

              reason = (
                  pick.get("ranking_reason")
                  or pick.get("llm_thesis")
                  or "依据综合因子评分入选"
              )

              risks = pick.get("llm_risks") or []
              if isinstance(risks, list):
                  risks = "；".join(str(item) for item in risks)

              risk = (
                  pick.get("risk_summary")
                  or risks
                  or "暂无明确风险提示"
              )

              lines.extend([
                  f"---\n**{rank}. {name}（{code}）**",
                  f"综合评分：**{score}**",
                  f"现价：{price}　涨跌：{change}",
                  f"行业：{sector}",
                  f"入选理由：{reason}",
                  f"风险提示：{risk}"
              ])

          lines.extend([
              "---",
              "⚠️ 以上为量化筛选后的研究候选，不构成买卖建议。"
          ])

          card = {
              "config": {
                  "wide_screen_mode": True
              },
              "header": {
                  "template": "green",
                  "title": {
                      "tag": "plain_text",
                      "content": "📈 AlphaSift 每日A股选股"
                  }
              },
              "elements": [
                  {
                      "tag": "div",
                      "text": {
                          "tag": "lark_md",
                          "content": "\n".join(lines)
                      }
                  }
              ]
          }

          payload = {
              "msg_type": "interactive",
              "card": card
          }

          if secret:
              timestamp = str(int(time.time()))
              string_to_sign = f"{timestamp}\n{secret}"

              sign = base64.b64encode(
                  hmac.new(
                      string_to_sign.encode("utf-8"),
                      digestmod=hashlib.sha256
                  ).digest()
              ).decode("utf-8")

              payload["timestamp"] = timestamp
              payload["sign"] = sign

          response = requests.post(
              webhook,
              json=payload,
              timeout=30
          )
          response.raise_for_status()

          result = response.json()
          code = result.get("code", result.get("StatusCode", 0))

          if code != 0:
              raise RuntimeError(f"飞书推送失败：{result}")

          print("格式化选股报告已成功发送到飞书")
          PY
